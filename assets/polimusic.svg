<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="840" height="140" role="img" aria-label="PoliMusic: one app rebuilt four times — V0 Windows app, V3 layered web app, V4 REST/XML Web API and web service, V5 microservices.">
  <style>
    :root{--fg:#1f2328;--dim:#59636e;--line:#d0d7de;--card:#f6f8fa;--acc:#bc4c00}
    @media (prefers-color-scheme: dark){:root{--fg:#e6edf3;--dim:#8b949e;--line:#30363d;--card:#161b22;--acc:#f0883e}}
    .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:var(--fg)}
    .v{font-size:12px;fill:var(--acc);font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:11.5px;fill:var(--dim)}
    .card{fill:var(--card);stroke:var(--line);stroke-width:1}
    .ar{stroke:var(--dim);stroke-width:1.2;fill:none}
    .cap{font-size:12px;fill:var(--dim)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8b949e"/>
    </marker>
  </defs>

  <text class="t cap" x="0" y="14">PoliMusic — the same app, rebuilt as the architecture grew</text>

  <g transform="translate(0,34)">
    <rect class="card" x="0.5" y="0.5" width="180" height="104" rx="4"/>
    <text class="t v" x="16" y="26">V0</text>
    <text class="t h" x="16" y="50">Windows app</text>
    <text class="t s" x="16" y="72">desktop client</text>
    <text class="t s" x="16" y="88">(WinApp)</text>
  </g>
  <path class="ar" d="M186 86H212" marker-end="url(#a)"/>

  <g transform="translate(220,34)">
    <rect class="card" x="0.5" y="0.5" width="180" height="104" rx="4"/>
    <text class="t v" x="16" y="26">V3</text>
    <text class="t h" x="16" y="50">Layered web app</text>
    <text class="t s" x="16" y="72">Entity · DataAccess</text>
    <text class="t s" x="16" y="88">· Business layers</text>
  </g>
  <path class="ar" d="M406 86H432" marker-end="url(#a)"/>

  <g transform="translate(440,34)">
    <rect class="card" x="0.5" y="0.5" width="180" height="104" rx="4"/>
    <text class="t v" x="16" y="26">V4</text>
    <text class="t h" x="16" y="50">Services</text>
    <text class="t s" x="16" y="72">REST/XML Web API</text>
    <text class="t s" x="16" y="88">+ web service</text>
  </g>
  <path class="ar" d="M626 86H652" marker-end="url(#a)"/>

  <g transform="translate(660,34)">
    <rect class="card" x="0.5" y="0.5" width="179" height="104" rx="4" style="stroke:var(--acc)"/>
    <text class="t v" x="16" y="26">V5</text>
    <text class="t h" x="16" y="50">Microservices</text>
    <text class="t s" x="16" y="72">song service +</text>
    <text class="t s" x="16" y="88">controllers</text>
  </g>
</svg>
