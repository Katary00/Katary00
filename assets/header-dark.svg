<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-label="Stalin Yungan — Backend developer, C#, .NET, SQL. Quito, Ecuador. Open to work.">
  <style>
    .bg{fill:#0d1117}
    .bar{fill:#161b22}
    .frame{fill:none;stroke:#30363d;stroke-width:1}
    .dot{fill:#30363d}
    .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:15px;fill:#c9d1d9}
    .dim{fill:#6e7681}
    .ok{fill:#3fb950}
    .acc{fill:#f0883e}
    .big{font-size:32px;font-weight:700;fill:#f0f6fc;letter-spacing:-0.5px}
    .l{opacity:0;animation:in .01s forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:1s}.l3{animation-delay:1.5s}
    .l4{animation-delay:2s}.l5{animation-delay:2.5s}.l6{animation-delay:3.1s}
    .cur{fill:#c9d1d9;opacity:0;animation:blink 1s steps(1) infinite 3.3s}
    .egg{opacity:0;animation:glitch 1.4s steps(1) 4.2s forwards}
    @keyframes glitch{0%{opacity:1;transform:translateX(3px)}8%{opacity:0}14%{opacity:1;transform:translateX(-2px)}22%{opacity:.25;transform:none}30%{opacity:1}38%{opacity:0}46%,100%{opacity:1;transform:none}}
    @keyframes in{to{opacity:1}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.l,.cur,.egg{animation:none;opacity:1}}
  </style>
  <rect class="bg" x="0.5" y="0.5" width="839" height="249" rx="6"/>
  <path class="bar" d="M6.5 1h827a5.5 5.5 0 0 1 5.5 5.5V31H1V6.5A5.5 5.5 0 0 1 6.5 1z"/>
  <line x1="1" y1="31" x2="839" y2="31" stroke="#30363d"/>
  <rect class="frame" x="0.5" y="0.5" width="839" height="249" rx="6"/>
  <circle class="dot" cx="20" cy="16" r="5"/><circle class="dot" cx="38" cy="16" r="5"/><circle class="dot" cx="56" cy="16" r="5"/>
  <text class="t dim" x="420" y="20" text-anchor="middle" font-size="12">katary00 — zsh</text>

  <text class="t l l1" x="28" y="66"><tspan class="ok">$</tspan> whoami</text>
  <text class="t big l l2" x="28" y="110">Stalin Yungan</text>
  <text class="t l l3" x="28" y="144" xml:space="preserve"><tspan class="dim">role    </tspan>Backend developer — C#, .NET, SQL</text>
  <text class="t l l4" x="28" y="170" xml:space="preserve"><tspan class="dim">based   </tspan>Quito, Ecuador · Software Engineering @ EPN</text>
  <text class="t l l5" x="28" y="196" xml:space="preserve"><tspan class="dim">status  </tspan><tspan class="acc">● open to work</tspan> — junior backend roles</text>
  <text class="t l l6" x="28" y="230"><tspan class="ok">$</tspan></text>
  <rect class="cur" x="46" y="217" width="9" height="17"/>
  <!-- control is an illusion -->
  <text class="t egg" x="812" y="230" text-anchor="end" font-size="13" style="fill:#3fb950;opacity:0">hello, friend.</text>
</svg>
